PACKAGE_NAME="ipu-bridge-dedup"
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="ipu-bridge"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
AUTOINSTALL="yes"

# The source is Linux v7.0 ipu-bridge.c. Never build for other series,
# in particular not for the 6.17 OEM fallback kernel.
BUILD_EXCLUSIVE_KERNEL="^7\.0\."

# dkms sources this file with $kernelver set. For a matching kernel, build only
# when its distribution module still has the duplicate and otherwise matches
# our source. A non-matching BUILD_EXCLUSIVE_KERNEL makes dkms skip the module
# (status 77) instead of failing, so kernel package installs never break.
if [ -n "$kernelver" ] && [[ $kernelver =~ $BUILD_EXCLUSIVE_KERNEL ]]; then
	if ! python3 -I "$(dirname "${BASH_SOURCE[0]}")/dkms-should-build.py" "$kernelver" >/dev/null 2>&1; then
		BUILD_EXCLUSIVE_KERNEL="^distribution-module-is-fine$"
	fi
fi
